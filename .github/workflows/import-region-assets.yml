name: Import Etheria region models

on:
  push:
    branches:
      - feature/etheria-3d-assets
    paths:
      - ".github/workflows/import-region-assets.yml"
      - ".github/scripts/import_region_assets.py"

permissions:
  contents: write

jobs:
  import-region-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Etheria
        uses: actions/checkout@v4
        with:
          ref: feature/etheria-3d-assets

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Import model packs
        run: python3 .github/scripts/import_region_assets.py

      - name: Install dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/assets/3d/regions apps/web/public/assets/3d/region-models.json
          if ! git diff --cached --quiet; then
            git commit -m "Import regional 3D environment models"
            git push origin feature/etheria-3d-assets
          else
            echo "No asset changes to commit."
          fi
