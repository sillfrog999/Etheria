
services:
  # ==========================================
  # ETHERIA BACKEND
  # ==========================================
  - type: web
    name: Etheria
    runtime: node
    plan: starter
    region: singapore

    buildCommand: >
      npx --yes pnpm@9 install &&
      npx --yes pnpm@9 --filter @etheria/shared build &&
      npx --yes pnpm@9 --filter @etheria/game-data build &&
      npx --yes pnpm@9 --filter @etheria/protocol build &&
      npx --yes pnpm@9 --filter @etheria/world-generator build &&
      npx --yes pnpm@9 --filter @etheria/server build

    startCommand: node apps/server/dist/index.js

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: SUPABASE_ANON_KEY
        sync: false

      - key: CLIENT_URL
        sync: false

  # ==========================================
  # ETHERIA FRONTEND
  # ==========================================
  - type: web
    runtime: static
    name: etheria-web

    buildCommand: >
      npx --yes pnpm@9 install &&
      npx --yes pnpm@9 --filter @etheria/shared build &&
      npx --yes pnpm@9 --filter @etheria/game-data build &&
      npx --yes pnpm@9 --filter @etheria/protocol build &&
      npx --yes pnpm@9 --filter @etheria/web build

    staticPublishPath: apps/web/dist

    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        sync: false

      - key: VITE_SOCKET_URL
        sync: false

      - key: VITE_SUPABASE_URL
        sync: false

      - key: VITE_SUPABASE_ANON_KEY
        sync: false
